<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Back-office — Pay243</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --ink: #0b1424; --ink-2: #2a3547; --muted: #5d6879; --line: #e4e8ef; --soft: #f4f6fa; --bg: #eef2f8; --card: #fff;
    --blue: #0057d9; --navy: #0a2a66; --side: #0b1424; --side-2: #1a2436;
    --ok: #12804a; --ok-bg: #e3f5ea; --warn: #8a5a00; --warn-bg: #fff1cc; --err: #b3121f; --err-bg: #fde8ea;
    --r: 14px; --font: "Segoe UI Variable Text", -apple-system, "Segoe UI", system-ui, Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 var(--font); color: var(--ink); background: var(--bg); }
  [hidden] { display: none !important; }
  a { color: var(--blue); }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); width: 100%; padding: 10px 12px; border: 1.5px solid #d6dce6; border-radius: 10px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 87, 217, .12); }
  textarea { min-height: 76px; resize: vertical; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 12px 0 5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; background: var(--ink); color: #fff; white-space: nowrap; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.light { background: var(--soft); color: var(--ink); }
  .btn.blue { background: var(--blue); }
  .btn.ok { background: var(--ok); } .btn.danger { background: var(--err); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .btn.full { width: 100%; margin-top: 16px; padding: 12px; }
  .lk { border: 0; background: none; color: var(--blue); font-weight: 600; padding: 2px 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
  .pill.ok, .pill.succeeded, .pill.active, .pill.approved { background: var(--ok-bg); color: var(--ok); }
  .pill.warn, .pill.pending, .pill.processing { background: var(--warn-bg); color: var(--warn); }
  .pill.err, .pill.failed, .pill.suspended, .pill.rejected, .pill.closed, .pill.canceled, .pill.expired { background: var(--err-bg); color: var(--err); }
  .pill.role { background: #e9efff; color: #1d3f9e; }
  .pill.role.super_admin { background: #0b1424; color: #f7d618; }
  .card { background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: 0 1px 2px rgba(11, 20, 36, .04); margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 90; max-width: 92vw; box-shadow: 0 12px 30px rgba(0, 0, 0, .25); }
  .toast.bad { background: var(--err); }
  .notice { background: var(--warn-bg); color: #5c4a00; border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 10px 0; }
  .flag { background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .secret { background: var(--ink); color: #f7d618; border-radius: 10px; padding: 12px; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }

  /* ---------- Connexion ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(120% 90% at 100% 0, #12357d 0, #0b1424 60%); }
  .login-card { background: #fff; border-radius: 22px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
  .login-card img { height: 34px; display: block; }
  .login-card h1 { font-size: 24px; margin: 22px 0 4px; letter-spacing: -.02em; }
  .login-card .sub { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
  .err { background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }

  /* ---------- Coque ---------- */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--side); color: #c9d1de; padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
  aside .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: #fff; font-weight: 700; }
  aside .brand img { height: 28px; outline: 2px solid #fff; }
  aside nav { display: grid; gap: 2px; }
  aside nav button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; color: #c9d1de; padding: 9px 10px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  aside nav button:hover { background: var(--side-2); color: #fff; }
  aside nav button.on { background: #fff; color: var(--ink); }
  aside nav svg { width: 18px; height: 18px; flex: none; }
  aside nav .count { margin-left: auto; background: #f7d618; color: var(--ink); border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 800; }
  aside .me { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--side-2); font-size: 13px; }
  aside .me b { color: #fff; display: block; }
  aside .me button { border: 0; background: none; color: #9fb0c8; padding: 6px 0 0; font-weight: 600; }
  main { padding: 26px max(30px, calc((100% - 1360px) / 2)) 60px; min-width: 0; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .mode { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); }
  .mode.live { background: var(--ok-bg); color: var(--ok); }

  /* ---------- Composants ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .kpi { background: #fff; border-radius: var(--r); padding: 16px 18px; box-shadow: 0 1px 2px rgba(11, 20, 36, .04); }
  .kpi small { color: var(--muted); font-size: 13px; display: block; }
  .kpi b { font-size: 28px; letter-spacing: -.02em; display: block; margin-top: 2px; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .kpi.alert b { color: var(--err); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .split { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input { flex: 1 1 260px; width: auto; }
  .toolbar select { width: auto; flex: 0 0 auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #f8faff; } tr.sel td { background: #eef4ff; }
  .tbl { overflow-x: auto; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  dl.kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; margin: 0; }
  dl.kv dt { color: var(--muted); font-size: 13px; } dl.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding-top: 8px; }
  .bars div { flex: 1; background: #cfdcf5; border-radius: 6px 6px 0 0; position: relative; min-height: 3px; }
  .bars div span { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .bars div b { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 11px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 11px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .list li:last-child { border-bottom: 0; }
  .list li.click { cursor: pointer; } .list li.sel { background: #eef4ff; margin: 0 -20px; padding: 11px 20px; }
  .docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .docs figure { margin: 0; border-radius: 10px; overflow: hidden; background: var(--ink); }
  .docs img { width: 100%; height: 220px; object-fit: contain; display: block; cursor: zoom-in; }
  .docs figcaption { background: #fff; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-top: 0; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .setting { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .setting label { margin-top: 0; }
  .setting .row { display: flex; gap: 8px; align-items: center; }
  .setting .row input { flex: 1; }
  .setting small { color: var(--muted); font-size: 12px; display: block; margin-top: 4px; }
  .switch { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .switch input { width: 20px; height: 20px; accent-color: var(--blue); }
  .modal-bg { position: fixed; inset: 0; background: rgba(11, 20, 36, .55); display: grid; place-items: center; padding: 16px; z-index: 80; }
  .modal { background: #fff; border-radius: 18px; padding: 24px; width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; }
  .modal h3 { margin: 0 0 6px; font-size: 20px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .thread { display: flex; flex-direction: column; gap: 8px; max-height: 58vh; overflow-y: auto; padding: 2px; }
  .bubble { max-width: 85%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45; }
  .bubble small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; white-space: normal; }
  .bubble.user { align-self: flex-start; background: var(--soft); }
  .bubble.support { align-self: flex-end; background: #e7efff; }
  .bubble.note { align-self: flex-end; background: #fff6cc; border: 1px dashed #e0c25a; }
  /* Pièces jointes du support */
  .sa-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .sa-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1px dashed #b9c6da; border-radius: 99px; font-size: 13px; font-weight: 600; color: #0057d9; cursor: pointer; background: #fff; margin: 0; }
  .sa-btn svg { width: 15px; height: 15px; }
  .sa-list { display: contents; }
  .sa-chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 4px 4px 4px 10px; border-radius: 99px; background: #eef3fb; font-size: 12px; color: #0b1424; }
  .sa-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .sa-chip.busy { opacity: .6; } .sa-chip.busy::after { content: "envoi…"; font-size: 11px; color: #5d6879; margin-right: 4px; }
  .sa-chip button { all: unset; cursor: pointer; padding: 0 6px; font-size: 16px; line-height: 1; color: #5d6879; }
  .sa-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; white-space: normal; }
  .sa-files img { width: 128px; height: 96px; object-fit: cover; border-radius: 8px; display: block; cursor: zoom-in; background: rgba(0,0,0,.08); }
  .sa-doc { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px; background: #fff; color: #0b1424 !important; font-size: 12px; text-decoration: none; border: 1px solid rgba(0,0,0,.08); max-width: 220px; }
  .sa-doc b { font-size: 10px; padding: 2px 5px; border-radius: 4px; background: #ce1021; color: #fff; }
  .sa-doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sa-zoom { position: fixed; inset: 0; z-index: 90; background: rgba(11,20,36,.85); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
  .sa-zoom[hidden] { display: none; }
  .sa-zoom img { max-width: 94vw; max-height: 82vh; border-radius: 8px; }
  .sa-zoom a { margin-top: 10px; color: #fff; font-size: 14px; font-weight: 600; }
  .sa-zoom div { display: grid; justify-items: center; }
  @media (max-width: 560px) { .sa-files img { width: 104px; height: 78px; } }
  .bubble.support .sa-doc, .bubble.note .sa-doc { background: #fff; }
  .bubble.system { align-self: center; background: none; color: var(--muted); font-size: 12px; text-align: center; }
  .lk-btn { border: 0; background: none; color: var(--blue); font-weight: 700; cursor: pointer; padding: 0 0 0 6px; font-size: 13px; }
  #zoom { cursor: zoom-out; } #zoom img { max-width: 96vw; max-height: 92vh; }
  .burger { display: none; }
  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 70; transform: translateX(-100%); transition: transform .2s; }
    aside.open { transform: none; }
    .burger { display: inline-flex; }
    main { padding: 18px 16px 50px; }
    .grid2, .split { grid-template-columns: 1fr; }
    dl.kv { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ======================= Connexion ======================= -->
<section id="login">
  <div class="login-card">
    <img src="/assets/logo.png" alt="Pay243">
    <h1 id="login-title">Back-office</h1>
    <p class="sub" id="login-sub">Accès réservé à l'équipe Pay243. Toutes les actions sont journalisées.</p>
    <form id="f-cred">
      <label for="l-email">Email professionnel</label><input id="l-email" name="email" type="email" autocomplete="username" required>
      <label for="l-pass">Mot de passe</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required>
      <button class="btn full">Continuer</button>
    </form>
    <form id="f-code" hidden>
      <div class="notice" id="code-sandbox" hidden></div>
      <label for="l-code">Code reçu par email</label><input id="l-code" name="otp_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
      <button class="btn full">Se connecter</button>
      <p style="text-align:center;margin:12px 0 0"><button type="button" class="lk" data-back>← Retour</button></p>
    </form>
    <form id="f-newpass" hidden>
      <p class="notice">Première connexion : choisissez votre mot de passe personnel (12 caractères minimum).</p>
      <label>Mot de passe provisoire</label><input name="current_password" type="password" autocomplete="current-password" required>
      <label>Nouveau mot de passe</label><input name="new_password" type="password" minlength="12" autocomplete="new-password" required>
      <label>Confirmation</label><input name="confirm" type="password" minlength="12" autocomplete="new-password" required>
      <button class="btn full">Enregistrer et continuer</button>
    </form>
    <form id="f-key" hidden>
      <label for="l-key">Clé de service (ADMIN_KEYS)</label><input id="l-key" name="key" type="password" autocomplete="off" required>
      <button class="btn full">Se connecter avec la clé</button>
      <p style="text-align:center;margin:12px 0 0"><button type="button" class="lk" data-back>← Connexion par email</button></p>
    </form>
    <div class="err" id="login-err" hidden></div>
    <p style="text-align:center;margin:16px 0 0" id="key-link"><button type="button" class="lk" id="use-key" style="font-size:13px;color:var(--muted)">Utiliser une clé de service</button></p>
  </div>
</section>

<!-- ======================= Application ======================= -->
<div class="shell" id="shell" hidden>
  <aside id="side">
    <div class="brand"><img src="/assets/logo.png" alt="Pay243"><span>Back-office</span></div>
    <nav id="nav"></nav>
    <div class="me"><b id="me-name"></b><span id="me-role" class="muted" style="color:#9fb0c8"></span><br><button id="logout">Se déconnecter</button></div>
  </aside>
  <main>
    <div class="page-head">
      <div style="display:flex;align-items:center;gap:12px"><button class="btn light sm burger" id="burger">☰</button><h1 id="page-title"></h1></div>
      <span class="mode" id="mode"></span>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="zoom" class="modal-bg" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dt = (s) => (s ? new Date(s).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—');
const fmt = (minor, cur) => (minor == null ? '—' : (Number(minor) / 100).toLocaleString('fr-FR', { minimumFractionDigits: cur === 'USD' ? 2 : 0, maximumFractionDigits: 2 }) + (cur === 'USD' ? ' $' : ' FC'));
const TYPE = { topup: 'Recharge', transfer: 'Transfert', payment: 'Paiement', refund: 'Remboursement', withdrawal: 'Retrait', conversion: 'Conversion', payout: 'Versement' };
const STATUS = { succeeded: 'Réussi', pending: 'En attente', failed: 'Échoué', processing: 'En cours', refunded: 'Remboursé', partially_refunded: 'Remb. partiel', canceled: 'Annulé', expired: 'Expiré', active: 'Actif', suspended: 'Suspendu', closed: 'Fermé', approved: 'Validée', rejected: 'Refusée' };
const pill = (st) => `<span class="pill ${esc(st)}">${esc(STATUS[st] || st)}</span>`;
let TOKEN = null; let ME = null; let PENDING = null; const blobs = [];
try { TOKEN = sessionStorage.getItem('pay243_admin'); } catch {}

function toast(msg, bad) { $$('.toast').forEach((t) => t.remove()); const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4500); }
async function api(method, path, body, raw) {
  const r = await fetch('/v1/admin' + path, { method, headers: { ...(raw ? { 'Content-Type': 'text/csv' } : { 'Content-Type': 'application/json' }), ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) }, body: raw ?? (body ? JSON.stringify(body) : undefined) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && TOKEN) { logout(); }
    throw Object.assign(new Error(j.error?.message || 'Erreur réseau'), { code: j.error?.code, status: r.status });
  }
  return j;
}
async function image(path) {
  const r = await fetch('/v1/admin' + path, { headers: { Authorization: 'Bearer ' + TOKEN } });
  if (!r.ok) throw new Error('Image indisponible');
  const u = URL.createObjectURL(await r.blob()); blobs.push(u); return u;
}
const freeBlobs = () => { while (blobs.length) URL.revokeObjectURL(blobs.pop()); };
const can = (p) => !!ME?.permissions.includes(p);
async function run(btn, fn) { if (btn) btn.disabled = true; try { await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) btn.disabled = false; } }

/** Fenêtre de saisie (motif obligatoire, choix…). Renvoie les valeurs ou null. */
function dialog({ title, text = '', fields = [], confirm = 'Confirmer', danger = false }) {
  return new Promise((resolve) => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<form class="modal"><h3>${esc(title)}</h3>${text ? `<p class="muted" style="font-size:14px">${text}</p>` : ''}
      ${fields.map((f) => `<label>${esc(f.label)}</label>${f.type === 'select' ? `<select name="${f.name}">${f.options.map((o) => `<option value="${esc(o.value)}" ${o.value === f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`
        : f.type === 'textarea' ? `<textarea name="${f.name}" ${f.required ? 'required minlength="5"' : ''} placeholder="${esc(f.placeholder || '')}"></textarea>`
        : `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value || '')}" ${f.required ? 'required' : ''} placeholder="${esc(f.placeholder || '')}">`}`).join('')}
      <div class="foot"><button type="button" class="btn light" data-x>Annuler</button><button class="btn ${danger ? 'danger' : ''}">${esc(confirm)}</button></div></form>`;
    document.body.appendChild(bg);
    const close = (v) => { bg.remove(); resolve(v); };
    bg.onclick = (e) => { if (e.target === bg || e.target.closest('[data-x]')) close(null); };
    $('form', bg).onsubmit = (e) => { e.preventDefault(); close(Object.fromEntries(new FormData(e.target))); };
    setTimeout(() => $('input, textarea, select', bg)?.focus(), 30);
  });
}
const reasonField = (label = 'Motif (journalisé)') => ({ name: 'reason', label, type: 'textarea', required: true });

// =====================================================================
//  Connexion
// =====================================================================
const loginErr = (m) => { $('#login-err').hidden = !m; $('#login-err').textContent = m || ''; };
const loginStep = (id) => { ['#f-cred', '#f-code', '#f-newpass', '#f-key'].forEach((f) => { $(f).hidden = f !== id; }); $('#key-link').hidden = id !== '#f-cred'; loginErr(); setTimeout(() => $(`${id} input`)?.focus(), 30); };
let CRED = null;
$('#f-cred').onsubmit = (e) => { e.preventDefault(); run(e.submitter, async () => {
  try {
    CRED = Object.fromEntries(new FormData(e.target));
    const r = await api('POST', '/auth/login', CRED);

function supFileUrl(p) {
  if (!SUP_URLS.has(p)) {
    SUP_URLS.set(p, fetch('/v1/admin' + p, { headers: { Authorization: 'Bearer ' + TOKEN } })
      .then((r) => { if (!r.ok) throw new Error('Fichier indisponible.'); return r.blob(); })

function bindSupAttach(form) {
  const input = form.querySelector('input[type=file]'); const list = form.querySelector('.sa-list');

    list.innerHTML = SUP_ATT.map((it, i) => `<span class="sa-chip ${it.id ? '' : 'busy'}"><span title="${esc(it.name)}">${esc(it.name)}</span><button type="button" data-i="${i}" aria-label="Retirer">×</button></span>`).join('');
    list.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => { SUP_ATT.splice(+b.dataset.i, 1); render(); });
  };
  render();
  input.onchange = async () => {
    const files = [...input.files]; input.value = '';
    for (const f of files) {
      if (SUP_ATT.length >= 3) { toast('3 pièces jointes maximum par message.', true); break; }
      if (!['image/jpeg', 'image/png', 'image/webp', 'application/pdf'].includes(f.type)) { toast(`${f.name} : photo (JPEG, PNG, WebP) ou PDF uniquement.`, true); continue; }
      if (f.size > 5 * 1024 * 1024) { toast(`${f.name} : 5 Mo maximum.`, true); continue; }
      const it = { name: f.name }; SUP_ATT.push(it); render();
      try {
        const r = await fetch('/v1/admin/support/files', { method: 'POST', headers: { 'Content-Type': f.type, Authorization: 'Bearer ' + TOKEN, 'X-File-Name': encodeURIComponent(f.name) }, body: f });

    }
  };
}

async function openKyc(id) {
  KYC_CURRENT = id; freeBlobs();
  $$('[data-kid]').forEach((li) => li.classList.toggle('sel', li.dataset.kid === id));
  const s = await api('GET', '/kyc/submissions/' + id);
  const d = s.duplicates;
  const dups = [...d.same_document_number.map((x) => `Même n° de pièce : <b>${esc(x.full_name)}</b> (${esc(x.phone || '')}) — ${esc(STATUS[x.status] || x.status)}`), ...d.same_image.map((x) => `Image identique déjà envoyée par <b>${esc(x.full_name)}</b>`)];
  $('#kyc-detail').innerHTML = `<div class="card"><h2>${esc(s.user.full_name)} ${pill(s.status)}</h2>
      ${dups.length ? `<div class="flag"><b>Alerte fraude</b><br>${dups.join('<br>')}</div>` : ''}
      <dl class="kv" style="margin-top:12px">
        <dt>Email</dt><dd>${esc(s.user.email || '—')}</dd><dt>Téléphone</dt><dd>${esc(s.user.phone || '—')}</dd>
        <dt>Type de compte</dt><dd>${s.user.account_type === 'business' ? 'Entreprise' : 'Particulier'}</dd>
        <dt>Pièce</dt><dd>${esc(s.document_label)}</dd><dt>Numéro</dt><dd class="mono">${esc(s.document_number)}</dd>
        <dt>Date de naissance</dt><dd>${esc(s.date_of_birth)}</dd><dt>Niveau actuel</dt><dd>${s.user.kyc_level}</dd>
        <dt>Demande reçue le</dt><dd>${dt(s.created_at)}</dd>
        ${s.reviewer ? `<dt>Traitée par</dt><dd>${esc(s.reviewer)} le ${dt(s.reviewed_at)}</dd>` : ''}${s.review_note ? `<dt>Note</dt><dd>${esc(s.review_note)}</dd>` : ''}
      </dl></div>
    <div class="card"><h2>Documents</h2><div class="docs" id="docs">${s.files.map((f) => `<figure><img data-kind="${f.kind}" alt="${KIND[f.kind]}"><figcaption>${KIND[f.kind]} · ${Math.round(f.size / 1024)} Ko</figcaption></figure>`).join('')}</div>
      <p class="muted">Contrôles : visage identique au selfie, nom identique au compte, pièce ni expirée ni retouchée, âge cohérent.</p></div>
    ${s.status === 'pending' && can('kyc.review') ? `<div class="card"><h2>Décision</h2>
      <label>Note interne / motif du refus (le motif est envoyé à l'utilisateur)</label><textarea id="k-note" maxlength="300"></textarea>
      <div class="actions" style="margin-top:8px">${['Photo floue ou illisible', 'Pièce expirée', 'Le selfie ne correspond pas à la pièce', 'Le nom ne correspond pas au compte'].map((r) => `<button class="btn light sm" data-reason="${esc(r)}">${esc(r)}</button>`).join('')}</div>
      ${d.same_document_number.some((x) => x.status === 'approved') ? '<label class="switch" style="margin-top:12px"><input type="checkbox" id="k-override"> Passer outre le doublon (note justificative obligatoire)</label>' : ''}
      <div class="actions" style="margin-top:14px"><button class="btn ok" id="k-approve">Valider et activer le compte</button><button class="btn danger" id="k-reject">Refuser</button></div></div>` : ''}`;
  for (const img of $$('#docs img')) {
    image(`/kyc/submissions/${id}/files/${img.dataset.kind}`).then((u) => { img.src = u; }).catch(() => { img.alt = 'Image indisponible'; });
    img.onclick = () => { $('#zoom').innerHTML = `<img src="${img.src}" alt="">`; $('#zoom').hidden = false; };
  }
  $$('[data-reason]').forEach((b) => b.onclick = () => { $('#k-note').value = b.dataset.reason; });
  const done = async (msg) => { toast(msg); await loadKyc(); await openKyc(id); };
  if ($('#k-approve')) $('#k-approve').onclick = (e) => run(e.currentTarget, async () => { await api('POST', `/kyc/submissions/${id}/approve`, { note: $('#k-note').value || undefined, override_duplicates: !!$('#k-override')?.checked }); await done('Identité validée : le compte est activé et l’utilisateur prévenu par email.'); });
  if ($('#k-reject')) $('#k-reject').onclick = (e) => run(e.currentTarget, async () => { await api('POST', `/kyc/submissions/${id}/reject`, { reason: $('#k-note').value }); await done('Demande refusée. L’utilisateur est prévenu par email.'); });
}
$('#zoom').onclick = () => { $('#zoom').hidden = true; };

// =====================================================================
//  Rapprochement et cantonnement
// =====================================================================
let TRUST = '';
async function renderRecon() {
  const manage = can('recon.manage');
  $('#view').innerHTML = `
    <div class="card"><h2>Cantonnement — monnaie électronique en circulation</h2>
      <form class="toolbar" id="f-trust" style="align-items:end"><div style="flex:1"><label>Compte de cantonnement CDF</label><input name="trust_CDF" type="number" step="0.01" placeholder="ex. 25000000"></div><div style="flex:1"><label>Compte de cantonnement USD</label><input name="trust_USD" type="number" step="0.01" placeholder="ex. 120000"></div><button class="btn">Calculer la couverture</button></form>
      <div id="safeguard"></div></div>
    <div class="grid2">
      <div class="card">${manage ? `<h2>Importer un relevé opérateur</h2>
        <form id="f-stmt"><label>Opérateur</label><select name="operator" id="stmt-op"></select>
          <label>Journée comptable (heure de Kinshasa)</label><input name="date" type="date" id="stmt-date" required>
          <label>Relevé CSV</label><input name="file" type="file" accept=".csv,text/csv" required>
          <label class="switch"><input type="checkbox" name="replace"> Remplacer un import existant</label>
          <button class="btn full">Rapprocher</button></form>
        <p class="muted">Colonnes : <code>provider_ref, reference, type (collect|disburse), amount, currency, status, timestamp</code>.</p>
        <button class="btn light full" id="sweep">Vérifier maintenant les transactions en attente</button>` : ''}
        <h2 style="margin-top:18px">Derniers rapprochements</h2><ul class="list" id="runs"></ul></div>
      <div class="card"><h2 id="exc-title">Écarts à traiter</h2><div id="exceptions"></div></div>
    </div>`;
  $('#f-trust').onsubmit = (e) => {
    e.preventDefault(); const d = new FormData(e.target); const qs = new URLSearchParams();
    for (const c of ['CDF', 'USD']) { const v = d.get('trust_' + c); if (v) qs.set('trust_' + c, Math.round(parseFloat(v) * 100)); }
    TRUST = qs.toString() ? '?' + qs : ''; loadSafeguarding().catch((x) => toast(x.message, true));
  };
  if (manage) {
    $('#f-stmt').onsubmit = (e) => { e.preventDefault(); run(e.submitter, async () => {
      const d = new FormData(e.target);
      const qs = new URLSearchParams({ operator: d.get('operator'), date: d.get('date'), ...(d.get('replace') ? { replace: '1' } : {}) });
      const j = await api('POST', '/reconciliation/statements?' + qs, null, await d.get('file').text());
      toast(`${j.rows} lignes · ${j.matched} concordantes · ${j.exceptions} écart(s)`); await loadRecon();
    }); };
    $('#sweep').onclick = (e) => run(e.currentTarget, async () => { const r = await api('POST', '/reconciliation/sweep'); toast(`${r.checked ?? 0} vérifiée(s) · ${r.resolved ?? 0} dénouée(s) · ${r.expired ?? 0} expirée(s) · ${r.flagged ?? 0} signalée(s)`); await loadRecon(); });
  }
  await loadRecon();
}
async function loadRecon() {
  const o = await api('GET', '/reconciliation/overview');
  if ($('#stmt-op') && !$('#stmt-op').options.length) { $('#stmt-op').innerHTML = o.operators.map((x) => `<option value="${x.id}">${esc(x.label)}</option>`).join(''); $('#stmt-date').value = o.business_date; }
  $('#runs').innerHTML = o.runs.length ? o.runs.map((r) => `<li><div><b>${esc(r.operator)} · ${esc(r.business_date)}</b> ${r.status === 'superseded' ? '<span class="pill">remplacé</span>' : ''}<div class="muted">${r.rows} lignes · ${r.matched} concordantes · <b>${r.exceptions}</b> écart(s) · par ${esc(r.imported_by)} le ${dt(r.created_at)}</div></div></li>`).join('') : '<li class="muted">Aucun relevé importé.</li>';
  await Promise.all([loadSafeguarding(), loadExceptions()]);
}
async function loadSafeguarding() {
  const r = await api('GET', '/reconciliation/safeguarding' + TRUST);
  $('#safeguard').innerHTML = `<div class="grid2">${r.data.map((c) => `<div class="setting"><h3>${c.currency}</h3><dl class="kv">
    <dt>En circulation</dt><dd>${fmt(c.e_money_outstanding, c.currency)}</dd><dt>dont clients</dt><dd>${fmt(c.breakdown.users, c.currency)}</dd>
    <dt>dont marchands</dt><dd>${fmt(c.breakdown.merchants, c.currency)}</dd><dt>dont retraits en cours</dt><dd>${fmt(c.breakdown.payouts_in_flight, c.currency)}</dd>
    <dt>Commissions</dt><dd>${fmt(c.platform.fees, c.currency)}</dd>${Object.entries(c.held_at_partners).map(([k, v]) => `<dt>Position ${esc(k)}</dt><dd>${fmt(v, c.currency)}</dd>`).join('')}
    <dt>Compte de cantonnement</dt><dd>${fmt(c.trust_account, c.currency)}</dd>
    <dt>Couverture</dt><dd>${c.covered == null ? '<span class="muted">saisir le solde bancaire</span>' : `<span class="pill ${c.covered ? 'ok' : 'err'}">${c.covered ? 'Couvert' : 'INSUFFISANT'}</span> ${fmt(c.coverage, c.currency)}`}</dd></dl></div>`).join('')}</div>`;
}
async function loadExceptions() {
  const r = await api('GET', '/reconciliation/exceptions?status=open');
  $('#exc-title').textContent = `Écarts à traiter (${r.data.length})`;
  const manage = can('recon.manage');
  $('#exceptions').innerHTML = r.data.length ? r.data.map((e) => {
    const t = e.transaction; const st = e.details?.statement;
    const canApply = t && ['pending', 'failed'].includes(t.status) && e.kind !== 'amount_mismatch';
    return `<div class="setting" style="margin-bottom:10px" data-exc="${e.id}"><div><span class="pill err">${esc(e.label)}</span> <span class="muted">${esc(e.operator || '')} · ${dt(e.created_at)}</span></div>
      <dl class="kv" style="margin-top:8px">${t ? `<dt>Transaction</dt><dd>${esc(TYPE[t.type] || t.type)} ${fmt(t.amount, t.currency)} · ${esc(t.status)}<br><span class="muted mono">${esc(t.id)}</span></dd>` : ''}
        ${st ? `<dt>Relevé opérateur</dt><dd>${st.type === 'collect' ? 'Encaissement' : 'Décaissement'} ${fmt(st.amount, st.currency)} · ${esc(st.status)}<br><span class="muted mono">${esc(st.provider_ref)} (ligne ${st.line})</span></dd>` : ''}
        ${e.details?.age_minutes != null ? `<dt>En attente depuis</dt><dd>${e.details.age_minutes} min</dd>` : ''}${e.details?.reason ? `<dt>Détail</dt><dd>${esc(e.details.reason)}</dd>` : ''}</dl>
      ${manage ? `<label>Note (obligatoire, journalisée)</label><input data-note placeholder="Ex. : confirmé sur le portail opérateur, réf. …">
      <div class="actions" style="margin-top:8px">${canApply ? '<button class="btn ok sm" data-act="apply_success">Valider l’opération</button>' : ''}${t?.status === 'pending' ? '<button class="btn danger sm" data-act="apply_failure">Déclarer échouée</button>' : ''}<button class="btn light sm" data-act="acknowledge">Traité hors système</button></div>` : ''}</div>`;
  }).join('') : '<p class="muted">Aucun écart ouvert.</p>';
  $$('[data-exc]').forEach((box) => $$('[data-act]', box).forEach((b) => b.onclick = () => run(b, async () => {
    await api('POST', `/reconciliation/exceptions/${box.dataset.exc}/resolve`, { action: b.dataset.act, note: $('[data-note]', box).value });
    toast('Écart traité.'); await loadRecon();
  })));
}

async function renderStaff() {
  const [staff, roles] = await Promise.all([api('GET', '/staff'), api('GET', '/roles')]);
  const assignable = roles.data.filter((r) => r.assignable);
  const manage = can('staff.manage');
  $('#view').innerHTML = `
    <div class="card"><div class="page-head" style="margin:0 0 10px"><h2 style="margin:0">Membres (${staff.data.length})</h2>${manage && assignable.length ? '<button class="btn blue" id="add-staff">Ajouter un membre</button>' : ''}</div>
      <div class="tbl"><table><thead><tr><th>Membre</th><th>Rôle</th><th>Statut</th><th>Dernière connexion</th><th></th></tr></thead><tbody>${staff.data.map((s) => {
        const mine = s.id === ME.id; const editable = manage && !mine && roles.data.find((r) => r.id === s.role)?.assignable;
        return `<tr><td><b>${esc(s.full_name)}</b>${mine ? ' <span class="pill">vous</span>' : ''}<div class="muted">${esc(s.email)}</div></td>
          <td><span class="pill role ${s.role}">${esc(s.role_label)}</span></td>
          <td>${pill(s.status)}${s.must_change_password ? '<div class="muted">mot de passe provisoire</div>' : ''}</td>
          <td class="muted">${dt(s.last_login_at)}</td>
          <td>${editable ? `<div class="actions"><button class="btn light sm" data-sa="role" data-id="${s.id}">Rôle</button><button class="btn light sm" data-sa="reset" data-id="${s.id}">Réinitialiser le mot de passe</button>${s.status === 'active' ? `<button class="btn danger sm" data-sa="suspend" data-id="${s.id}">Désactiver</button>` : `<button class="btn ok sm" data-sa="activate" data-id="${s.id}">Réactiver</button>`}</div>` : ''}</td></tr>`;
      }).join('')}</tbody></table></div></div>
    <div class="card"><h2>Rôles et permissions</h2><div class="settings-grid">${roles.data.map((r) => `<div class="setting"><span class="pill role ${r.id}">${esc(r.label)}</span><p class="muted" style="margin:8px 0 0">${esc(r.description)}</p></div>`).join('')}</div></div>`;
  const showPassword = (title, s, pwd) => dialog({ title, text: `Mot de passe provisoire de <b>${esc(s.full_name || s.email)}</b>, également envoyé à ${esc(s.email)}. Il ne sera plus affiché. Un changement est imposé à la première connexion.<div class="secret" style="margin-top:12px">${esc(pwd)}</div>`, confirm: 'J’ai noté' });
  if ($('#add-staff')) $('#add-staff').onclick = async () => {
    const v = await dialog({ title: 'Ajouter un membre', text: 'Une invitation avec un mot de passe provisoire est envoyée par email.', fields: [{ name: 'full_name', label: 'Nom complet', required: true }, { name: 'email', label: 'Email professionnel', type: 'email', required: true }, { name: 'role', label: 'Rôle', type: 'select', value: assignable.at(-1).id, options: assignable.map((r) => ({ value: r.id, label: `${r.label} — ${r.description}` })) }], confirm: 'Créer l’accès' });
    if (v) run(null, async () => { const r = await api('POST', '/staff', v); await renderStaff(); await showPassword('Accès créé', r.staff, r.temporary_password); });
  };
  $$('[data-sa]').forEach((b) => b.onclick = async () => {
    const s = staff.data.find((x) => x.id === b.dataset.id);
    if (b.dataset.sa === 'role') { const v = await dialog({ title: `Rôle de ${s.full_name}`, text: 'Le changement de rôle ferme ses sessions en cours.', fields: [{ name: 'role', label: 'Rôle', type: 'select', value: s.role, options: assignable.map((r) => ({ value: r.id, label: r.label })) }], confirm: 'Appliquer' }); if (v) run(b, async () => { await api('PATCH', `/staff/${s.id}`, { role: v.role }); toast('Rôle modifié.'); await renderStaff(); }); }
    if (b.dataset.sa === 'suspend') { const v = await dialog({ title: `Désactiver ${s.full_name} ?`, text: 'Ses sessions sont fermées immédiatement.', confirm: 'Désactiver', danger: true }); if (v) run(b, async () => { await api('PATCH', `/staff/${s.id}`, { status: 'suspended' }); toast('Accès désactivé.'); await renderStaff(); }); }
    if (b.dataset.sa === 'activate') run(b, async () => { await api('PATCH', `/staff/${s.id}`, { status: 'active' }); toast('Accès réactivé.'); await renderStaff(); });
    if (b.dataset.sa === 'reset') { const v = await dialog({ title: `Réinitialiser le mot de passe de ${s.full_name} ?`, text: 'Un nouveau mot de passe provisoire lui est envoyé ; ses sessions sont fermées.', confirm: 'Réinitialiser' }); if (v) run(b, async () => { const r = await api('POST', `/staff/${s.id}/reset-password`); await showPassword('Mot de passe réinitialisé', s, r.temporary_password); }); }
  });
}

// =====================================================================
//  Paramètres de la plateforme
// =====================================================================
async function renderSettings() {
  const r = await api('GET', '/settings');
  const manage = can('settings.manage');
  const by = (prefix) => r.data.filter((s) => s.key.startsWith(prefix));
  const field = (s) => s.key === 'signup.enabled'
    ? `<div class="setting"><label class="switch"><input type="checkbox" data-key="${s.key}" ${s.value ? 'checked' : ''} ${manage ? '' : 'disabled'}> ${esc(s.label)}</label><small>${s.overridden ? `Modifié par ${esc(s.updated_by)} le ${dt(s.updated_at)}` : 'Valeur par défaut'}</small></div>`
    : `<div class="setting"><label>${esc(s.label)}</label><div class="row"><input type="number" step="any" data-key="${s.key}" value="${s.value}" ${manage ? '' : 'disabled'}><span class="muted">${esc(s.unit)}</span>${manage && s.overridden ? `<button class="lk" data-reset="${s.key}" title="Revenir à ${s.default}">↺</button>` : ''}</div>
       <small>${s.overridden ? `Modifié par ${esc(s.updated_by)} le ${dt(s.updated_at)} · défaut ${s.default}` : 'Valeur par défaut (variables d’environnement)'}</small></div>`;
  const env = r.environment;
  $('#view').innerHTML = `
    ${manage ? '' : '<div class="notice">Lecture seule : seul un super administrateur peut modifier ces paramètres.</div>'}
    <div class="card"><h2>Change et frais</h2><div class="settings-grid">${[...by('fx.'), ...by('fees.')].map(field).join('')}</div></div>
    <div class="card"><h2>Plafonds par niveau de vérification</h2>${[1, 2, 3].map((l) => `<h3 style="margin-top:${l > 1 ? 14 : 0}px">Niveau ${l}</h3><div class="settings-grid">${by(`kyc.${l}.`).map(field).join('')}</div>`).join('')}</div>
    <div class="card"><h2>Inscriptions</h2><div class="settings-grid">${by('signup.').map(field).join('')}</div></div>
    ${manage ? '<div class="actions" style="margin-bottom:16px"><button class="btn blue" id="save-settings">Enregistrer les modifications</button></div>' : ''}
    <div class="card"><h2>Environnement</h2><dl class="kv"><dt>Mode</dt><dd>${env.mode === 'live' ? 'Production' : 'Démonstration (sandbox)'}</dd><dt>Adresse</dt><dd>${esc(env.base_url)}</dd>
      ${Object.entries(env.drivers).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v === 'mock' ? '<span class="pill warn">simulé</span>' : `<span class="pill ok">${esc(v)}</span>`}</dd>`).join('')}</dl>
      <p class="muted">Ces réglages se font dans les variables d'environnement du serveur (Easypanel).</p></div>`;
  if (!manage) return;
  $$('[data-reset]').forEach((b) => b.onclick = () => run(b, async () => { await api('PUT', '/settings', { [b.dataset.reset]: null }); toast('Valeur par défaut rétablie.'); await renderSettings(); }));
  $('#save-settings').onclick = async (e) => {
    const patch = {};
    for (const el of $$('[data-key]')) {
      const s = r.data.find((x) => x.key === el.dataset.key);
      const v = el.type === 'checkbox' ? el.checked : Number(el.value);
      if (v !== s.value) patch[s.key] = v;
    }
    if (!Object.keys(patch).length) return toast('Aucune modification.');
    const ok = await dialog({ title: 'Appliquer ces changements ?', text: `${Object.keys(patch).length} paramètre(s) modifié(s), appliqué(s) immédiatement à toute la plateforme et journalisé(s).`, confirm: 'Appliquer' });
    if (ok) run(e.currentTarget, async () => { await api('PUT', '/settings', patch); toast('Paramètres enregistrés.'); await renderSettings(); });
  };
}

const ACTIONS = { 'staff.login': 'Connexion', 'staff.create': 'Membre ajouté', 'staff.update': 'Membre modifié', 'staff.reset_password': 'Mot de passe réinitialisé', 'staff.password_change': 'Mot de passe changé', 'user.view': 'Fiche consultée', 'user.suspend': 'Compte suspendu', 'user.reactivate': 'Compte réactivé', 'user.unlock_pin': 'PIN débloqué', 'user.revoke_sessions': 'Sessions fermées', 'user.kyc_level': 'Niveau KYC modifié', 'merchant.suspend': 'Marchand suspendu', 'merchant.reactivate': 'Marchand réactivé', 'merchant.revoke_keys': 'Clés révoquées', 'settings.update': 'Paramètres modifiés', 'kyc.view': 'Demande KYC consultée', 'kyc.view_file': 'Pièce consultée', 'kyc.approve': 'KYC validé', 'kyc.reject': 'KYC refusé' };
async function renderAudit() {
  $('#view').innerHTML = `<form class="toolbar" id="f-audit"><input name="actor" placeholder="Auteur (nom ou email)"><select name="action"><option value="">Toutes les actions</option><option value="staff.">Équipe</option><option value="user.">Utilisateurs</option><option value="merchant.">Marchands</option><option value="kyc.">KYC</option><option value="recon">Rapprochement</option><option value="settings.">Paramètres</option></select><input name="target" placeholder="Cible (usr_…, mch_…)"><button class="btn">Filtrer</button></form><div class="card tbl" id="audit-list"></div>`;
  const load = async () => {
    const qs = new URLSearchParams([...new FormData($('#f-audit'))].filter(([, v]) => v)); qs.set('limit', '300');
    const r = await api('GET', '/audit?' + qs);
    $('#audit-list').innerHTML = r.data.length ? `<table><thead><tr><th>Date</th><th>Action</th><th>Auteur</th><th>Cible</th><th>Détails</th></tr></thead><tbody>${r.data.map((a) => `<tr><td class="muted" style="white-space:nowrap">${dt(a.created_at)}</td><td><b>${esc(ACTIONS[a.action] || a.action)}</b><div class="muted mono">${esc(a.action)}</div></td><td>${esc(a.actor)}<div class="muted">IP ${esc(a.ip || '—')}</div></td><td class="mono">${esc(a.target || '')}</td><td class="muted" style="max-width:340px;overflow-wrap:anywhere">${a.details ? esc(JSON.stringify(a.details)) : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Aucune entrée.</p>';
  };
  $('#f-audit').onsubmit = (e) => { e.preventDefault(); load().catch((x) => toast(x.message, true)); };
  await load();
}

if (TOKEN) start().catch(() => logout()); else loginStep('#f-cred');
