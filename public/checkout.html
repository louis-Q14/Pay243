<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paiement sécurisé — Pay243</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .sum { text-align: center; padding: 8px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .sum .amt { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .methods { display: grid; gap: 8px; }
  .methods button { justify-content: flex-start; background: var(--k-raise); color: var(--ink); border: 1.5px solid var(--k-line-2); padding: 14px; }
  .methods button.on { border-color: var(--k-gold); background: #221d12; box-shadow: 0 0 0 1px var(--k-gold); }
  .sum .amt { font-variant-numeric: tabular-nums; }
  .state { text-align: center; padding: 26px 8px; }
  .state .big { font-size: 46px; }
  .spinner { width: 42px; height: 42px; border: 4px solid var(--k-line-2); border-top-color: var(--blue); border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 14px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .secure { text-align: center; margin: 14px 0 6px; }
  .secure-logos { text-align: center; margin: 0; }
  .secure-logos .brand-logos { flex-wrap: wrap; justify-content: center; gap: 14px; opacity: .9; }
  .methods button .brand-logos { gap: 6px; }
</style>
<link rel="stylesheet" href="/assets/kuba.css">
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/rumba-app.css">
<style>
  /* Paiement hébergé — monde « pochette de rumba » : le montant sur une pochette, les moyens en lignes filetées,
     l'attente marquée par un petit disque qui tourne à 33 ⅓ tours. */
  main.center { max-width: 480px; margin: 5vh auto 40px; padding: 0 16px; }
  .brand .logo-img { height: 30px; box-shadow: none; border-radius: 0; }
  #box.card { padding: 0 0 24px; overflow: hidden; }
  #box > :not(.sum) { margin-left: 24px; margin-right: 24px; }
  .sum { position: relative; text-align: left; margin: 0 0 22px; padding: 26px 26px 32px; background: var(--k-ground); border-bottom: 0; }
  .sum::before { content: ""; position: absolute; inset: 10px 10px 15px; border: 1px solid rgba(212, 173, 90, .38); pointer-events: none; }
  .sum::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--rdc-blue) 0 33.3%, var(--rdc-yellow) 33.3% 66.6%, var(--rdc-red) 66.6%); }
  .sum .muted { font-size: 15px; color: var(--k-mute); }
  .sum .muted b { color: var(--k-gold-hi); }
  .sum .amt { margin: 8px 0 4px; font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 11vw, 52px); line-height: 1; letter-spacing: -.04em; color: var(--k-gold); }
  .sum .pill { margin-top: 8px; }
  .methods { gap: 0; border-top: 1px solid var(--k-line-2); }
  .methods button { justify-content: flex-start; white-space: nowrap; min-height: 58px; padding: 0 14px; gap: 12px; background: transparent; border: 0; border-bottom: 1px solid var(--k-line); border-radius: 0; color: var(--k-ivory); font-size: 16px; font-weight: 600; }
  .methods button:hover { background: var(--k-raise); filter: none; }
  .methods button.on { background: var(--k-raise); box-shadow: inset 0 0 0 1px var(--k-gold); border-color: transparent; }
  .methods button .ico { width: 22px; height: 22px; color: var(--k-gold); }
  .methods button .brand-logos { border-radius: 2px; padding: 4px 7px; gap: 6px; flex: none; }
  .methods button .brand-logos img { height: 13px; }
  .methods button .brand-logos img.airtel { height: 17px; }
  .methods button .brand-logos img.orange { height: 14px; }
  .op label { border-radius: 2px; }
  #box > a { display: block; margin-top: 8px; }
  #box > a button.link { width: 100%; justify-content: center; text-align: center; }
  #pane label { color: var(--k-ivory); font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  #pane .op { margin-top: 10px; }
  .state { text-align: center; padding: 28px 8px 8px; }
  .state .big { display: grid; place-items: center; margin-bottom: 12px; }
  .state .big svg { width: 48px; height: 48px; }
  .state .big.ok svg { color: var(--k-ok); } .state .big.warn svg { color: var(--k-warn); } .state .big.bad svg { color: var(--k-err); }
  .state b { display: block; font-family: var(--font-display); font-size: 22px; letter-spacing: -.02em; }
  /* l'attente : un petit disque, étiquette dorée, qui tourne à 33 ⅓ tours par minute */
  .spinner { width: 56px; height: 56px; margin: 0 auto 16px; border: 0; border-radius: 50%; animation: s 1.8s linear infinite;
    background: radial-gradient(circle, var(--k-ground) 0 7%, var(--k-gold) 7.5% 32%, transparent 32.5%), repeating-radial-gradient(circle, #0e0d0a 0 1.5px, #221e17 1.5px 3px);
    box-shadow: 0 0 0 1px var(--k-line-2); }
  .spinner::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 80%, rgba(242, 234, 216, .12) 88%, transparent 96%); }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .secure { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px 0 8px; font-size: 14px; color: var(--k-mute); }
  .secure svg { width: 16px; height: 16px; color: var(--k-gold); }
  .secure-logos .brand-logos { border-radius: 2px; }
  /* téléphone compact */
  @media (max-width: 560px) {
    main.center { margin: 16px auto 28px; padding: 0 12px; }
    .brand .logo-img { height: 24px; }
    #box > :not(.sum) { margin-left: 16px; margin-right: 16px; }
    .sum { padding: 18px 18px 24px; margin-bottom: 16px; }
    .sum::before { inset: 7px 7px 12px; }
    .sum .muted { font-size: 14px; }
    .sum .amt { font-size: 36px; }
    .methods button { min-height: 50px; font-size: 15px; }
    #pane label { margin: 12px 0 5px; font-size: 13px; }
    .state { padding: 20px 6px 6px; }
    .state .big svg { width: 40px; height: 40px; }
    .state b { font-size: 19px; }
    .spinner { width: 46px; height: 46px; }
  }
</style>
</head>
<body>
<main class="center" style="margin-top:4vh">
  <div style="display:flex;justify-content:center;margin-bottom:14px"><div class="brand"><img src="/assets/logo.png" alt="Pay243" class="logo-img"></div></div>
  <div class="card" id="box"><div class="state"><div class="spinner"></div>Chargement…</div></div>
  <p class="muted secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Paiement sécurisé</p>
  <p class="secure-logos"><span class="brand-logos">
    <img class="mpesa" src="/assets/brands/mpesa-wordmark.png" alt="M-Pesa"><img class="airtel" src="/assets/brands/airtel-money.png" alt="Airtel Money"><img class="orange" src="/assets/brands/orange-money.png" alt="Orange Money"><img class="visa" src="/assets/brands/visa.png" alt="Visa"><img class="mastercard" src="/assets/brands/mastercard.png" alt="Mastercard">
  </span></p>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const ID = location.pathname.split('/').pop();
let TOKEN = null; try { TOKEN = sessionStorage.getItem('pay243_token'); } catch {}
let P = null; let METHOD = 'mobile_money';
// Le marchand peut ouvrir la page sur un moyen precis : /checkout/<id>?method=card (ou wallet, mobile_money).
// ?method=card : seule la carte est proposee (le marchand a calcule le montant pour un paiement par carte).
const CARD_ONLY = new URLSearchParams(location.search).get('method') === 'card';
{ const m = new URLSearchParams(location.search).get('method'); if (['mobile_money', 'wallet', 'card'].includes(m)) METHOD = m; }
const OPS = { mpesa: 'M-Pesa', airtel: 'Airtel Money', orange: 'Orange Money' };
// Icônes dessinées (même trait que le wallet), à la place des émojis
const svg = (d) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  wallet: svg('<path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/><path d="M4 7l11-3v3M16 13.5h.01"/>'),
  card: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>'),
  warn: svg('<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  ok: svg('<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>'),
};
const BRAND_LOGO = { mpesa: '/assets/brands/mpesa-wordmark.png', airtel: '/assets/brands/airtel-money.png', orange: '/assets/brands/orange-money.png' };
const fmt = (m, c) => (c === 'USD' ? (m / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' $' : (m / 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' FC').replace(/ /g, ' '); // espace insécable lisible entre les milliers
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const detectOp = (phone) => { const d = String(phone).replace(/\D/g, '').replace(/^243/, '').replace(/^0/, '').slice(0, 2);
  return ['81','82','83'].includes(d) ? 'mpesa' : ['97','98','99'].includes(d) ? 'airtel' : ['80','84','85','89'].includes(d) ? 'orange' : null; };

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error?.message || 'Erreur réseau'), { code: j.error?.code, details: j.error?.details });
  return j;
}
const DEVICE_ID = (() => {
  try { let d = localStorage.getItem('pay243_device'); if (!d) { d = crypto.randomUUID(); localStorage.setItem('pay243_device', d); } return d; }
  catch { return null; }
})();
const err = (m) => { const e = $('#err'); if (e) { e.textContent = m; e.classList.remove('hidden'); } };

async function load() {
  try { P = await api('GET', '/v1/checkout/' + ID); } catch (e) {
    if (TOKEN) { TOKEN = null; return load(); }
    $('#box').innerHTML = `<div class="state"><div class="big bad">${ICON.warn}</div><b>${esc(e.message)}</b></div>`; return;
  }
  render();
}

function header() {
  return `<div class="sum"><div class="muted">Paiement à <b>${esc(P.merchant.name)}</b></div><div class="amt">${fmt(P.amount, P.currency)}</div>
    ${P.description ? `<div class="muted">${esc(P.description)}</div>` : ''}${P.sandbox ? '<span class="pill">MODE TEST</span>' : ''}</div>`;
}

function render() {
  if (P.status === 'succeeded' || P.status === 'refunded' || P.status === 'partially_refunded') return done();
  if (P.status === 'processing') return waiting();
  if (['canceled', 'expired'].includes(P.status)) {
    $('#box').innerHTML = header() + `<div class="state"><div class="big warn">${ICON.clock}</div><b>${P.status === 'expired' ? 'Ce lien de paiement a expiré.' : 'Ce paiement a été annulé.'}</b></div>`; return;
  }
  $('#box').innerHTML = header() + `
    <div class="methods">
      ${CARD_ONLY ? '' : `<button data-m="mobile_money"><span class="brand-logos">${['mpesa', 'airtel', 'orange'].map((k) => `<img class="${k}" src="${BRAND_LOGO[k]}" alt="">`).join('')}</span>Mobile Money</button>
      <button data-m="wallet">${ICON.wallet}Wallet Pay243</button>`}
      <button data-m="card">${ICON.card}Carte bancaire</button>
    </div>
    <div id="pane" style="margin-top:14px"></div>
    <p id="err" class="notice ${P.last_error ? '' : 'hidden'}" style="margin-top:12px;color:var(--err)">${esc(P.last_error || '')}</p>
    ${P.cancel_url ? `<a href="${esc(P.cancel_url)}"><button class="link full">Annuler et retourner chez le marchand</button></a>` : ''}`;
  document.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { METHOD = b.dataset.m; pane(); });
  pane();
}

function pane() {
  document.querySelectorAll('[data-m]').forEach((b) => b.classList.toggle('on', b.dataset.m === METHOD));
  const el = $('#pane');
  if (METHOD === 'mobile_money') {
    el.innerHTML = `<form id="f"><label>Votre numéro Mobile Money</label><input name="phone" inputmode="tel" placeholder="0812345678" required id="ph">
      <div class="op" style="margin-top:10px">${P.operators.map((o) => `<label title="${esc(o.label.replace(' (Vodacom)', ''))}"><input type="radio" name="operator" value="${esc(o.id)}"><span>${BRAND_LOGO[o.id] ? `<img class="op-logo ${esc(o.id)}" src="${BRAND_LOGO[o.id]}" alt="${esc(o.label.replace(' (Vodacom)', ''))}">` : esc(o.label)}</span></label>`).join('')}</div>
      <button class="full">Payer ${fmt(P.amount, P.currency)}</button>
      ${P.sandbox ? '<p class="muted">Test : un numéro finissant par 0000 simule un refus.</p>' : ''}</form>`;
    $('#ph').oninput = (e) => { const op = detectOp(e.target.value); if (op) $(`input[name=operator][value=${op}]`).checked = true; };
    $('#f').onsubmit = submit((d) => ({ method: 'mobile_money', phone: d.phone, operator: d.operator }));
  } else if (METHOD === 'wallet') {
    if (!P.customer) {
      el.innerHTML = `<form id="f"><p class="muted">Connectez-vous à votre wallet Pay243.</p><label>Email ou téléphone</label><input name="identifier" required autocomplete="username">
        <label>Mot de passe</label><input name="password" type="password" required>
        <div id="otpbox" class="hidden"><label>Code de vérification reçu par email</label><input name="otp_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
        <button class="full">Se connecter</button>
        <p class="muted">Pas de compte ? <a href="/signup" target="_blank">Créer un wallet</a></p></form>`;
      $('#f').onsubmit = async (e) => { e.preventDefault(); e.submitter.disabled = true;
        const d = Object.fromEntries(new FormData(e.target)); if (!d.otp_code) delete d.otp_code;
        if (DEVICE_ID) d.device_id = DEVICE_ID;
        d.context = 'checkout'; // code email exige a chaque connexion depuis la page de paiement
        try { const r = await api('POST', '/v1/auth/login', d); TOKEN = r.token; try { sessionStorage.setItem('pay243_token', TOKEN); } catch {} await load(); }
        catch (x) {
          if (x.code === 'otp_required') { $('#otpbox').classList.remove('hidden'); $('#otpbox input').required = true; $('#otpbox input').focus(); }
          err(x.message + (x.details?.sandbox_code ? ` (sandbox : ${x.details.sandbox_code})` : '')); e.submitter.disabled = false;
        } };
    } else {
      const enough = P.customer.balance >= P.amount;
      el.innerHTML = `<form id="f"><p>Bonjour <b>${esc(P.customer.full_name)}</b>. Solde ${P.currency} : <b>${fmt(P.customer.balance, P.currency)}</b></p>
        <p class="muted" style="margin-top:-4px">Ce n'est pas vous ? <a href="#" id="switch">Se déconnecter et changer de compte</a></p>
        ${enough ? '' : '<p class="notice">Solde insuffisant. <a href="/app" target="_blank">Recharger mon wallet</a> puis réessayez.</p>'}
        <label>PIN de transaction</label><input name="pin" type="password" inputmode="numeric" required>
        <button class="full" ${enough ? '' : 'disabled'}>Payer ${fmt(P.amount, P.currency)}</button></form>`;
      $('#f').onsubmit = submit((d) => ({ method: 'wallet', pin: d.pin }));
      // Deconnexion du wallet sur cette page : on oublie le jeton et on recharge le paiement sans client.
      $('#switch').onclick = async (e) => { e.preventDefault();
        TOKEN = null; try { sessionStorage.removeItem('pay243_token'); } catch {}
        METHOD = 'wallet'; await load(); };
    }
  } else {
    const saved = P.customer?.cards || [];
    el.innerHTML = `<form id="f">
      ${saved.length ? `<label>Carte enregistrée</label><select name="card_id"><option value="">— Nouvelle carte —</option>${saved.map((c) => `<option value="${esc(c.id)}">${esc(String(c.brand).toUpperCase())} •••• ${esc(c.last4)}</option>`).join('')}</select>` : ''}
      <div id="newcard"><label>Numéro de carte</label><input name="number" inputmode="numeric" autocomplete="cc-number">
      <div class="row"><div><label>MM</label><input name="exp_month" inputmode="numeric" maxlength="2" autocomplete="cc-exp-month"></div><div><label>AAAA</label><input name="exp_year" inputmode="numeric" maxlength="4" autocomplete="cc-exp-year"></div><div><label>CVC</label><input name="cvc" inputmode="numeric" maxlength="4" autocomplete="cc-csc"></div></div></div>
      <div id="pinbox" class="hidden"><label>PIN Pay243</label><input name="pin" type="password" inputmode="numeric"></div>
      <button class="full">Payer ${fmt(P.amount, P.currency)}</button>
      ${P.sandbox ? '<p class="muted">Test : 4242 4242 4242 4242 (acceptée), 4000 0000 0000 0002 (refusée).</p>' : ''}</form>`;
    const sel = $('select[name=card_id]');
    if (sel) sel.onchange = () => { $('#newcard').classList.toggle('hidden', !!sel.value); $('#pinbox').classList.toggle('hidden', !sel.value); };
    $('#f').onsubmit = submit(async (d) => {
      if (d.card_id) return { method: 'card', card_id: d.card_id, pin: d.pin };
      // En production : tokenisation par le SDK du processeur de cartes (le PAN ne touche jamais Pay243).
      const { token } = await api('POST', '/sandbox/cards/tokenize', { number: d.number, exp_month: d.exp_month, exp_year: d.exp_year, cvc: d.cvc });
      return { method: 'card', token };
    });
  }
}

function submit(build) {
  return async (e) => {
    e.preventDefault(); const btn = e.submitter; btn.disabled = true;
    try { const body = await build(Object.fromEntries(new FormData(e.target))); P = { ...P, ...(await api('POST', `/v1/checkout/${ID}/pay`, body)) }; render(); }
    catch (x) { err(x.message); btn.disabled = false; }
  };
}

function waiting() {
  $('#box').innerHTML = header() + `<div class="state"><div class="spinner"></div><b>Confirmez le paiement sur votre téléphone</b>
    <p class="muted">Une demande ${P.operators.length ? 'Mobile Money' : ''} a été envoyée. Saisissez votre PIN opérateur pour valider.</p></div>`;
  setTimeout(async () => { try { P = await api('GET', '/v1/checkout/' + ID); } catch {} render(); }, 2500);
}

function done() {
  const url = P.return_url ? `${P.return_url}${P.return_url.includes('?') ? '&' : '?'}payment_id=${encodeURIComponent(P.id)}` : null;
  $('#box').innerHTML = header() + `<div class="state"><div class="big ok">${ICON.ok}</div><b>Paiement réussi</b><p class="muted">Merci ! ${esc(P.merchant.name)} a reçu votre paiement.</p>
    ${url ? `<a href="${esc(url)}"><button class="full">Retour chez le marchand</button></a>` : ''}</div>`;
  if (url) setTimeout(() => { location.href = url; }, 4000);
}

load();
</script>
</body>
</html>
